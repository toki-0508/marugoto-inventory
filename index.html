<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#2563eb" />
  <title>まるごと祭 物品管理</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <button class="back-btn" id="backBtn" hidden>←</button>
    <h1 id="pageTitle">物品一覧</h1>
    <button class="icon-btn" id="sheetBtn" title="スプレッドシートを開く">📄</button>
    <button class="icon-btn" id="logBtn" title="ログ">🕒</button>
  </header>

  <main id="view"></main>

  <a class="apply-link" href="./apply.html">利用者用フォーム →</a>

  <nav class="tabbar cols-3">
    <button data-go="home"     class="tab active">
      <span class="ic">🏠</span><span>一覧</span>
    </button>
    <button data-go="requests" class="tab">
      <span class="ic">📋</span><span>申請</span>
    </button>
    <button data-go="add"      class="tab">
      <span class="ic">＋</span><span>追加</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <div class="comment-modal" id="commentModal" hidden style="display:none">
    <div class="comment-modal-card">
      <h3 id="cmTitle">タイトル</h3>
      <p id="cmDesc" class="cm-desc"></p>
      <textarea id="cmInput" rows="4"></textarea>
      <div class="comment-modal-actions">
        <button type="button" id="cmCancel">キャンセル</button>
        <button type="button" id="cmConfirm" class="primary">確定</button>
      </div>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
