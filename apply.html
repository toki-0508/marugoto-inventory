<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <title>物品申請フォーム</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>物品申請フォーム</h1>
  </header>

  <main id="view" style="padding-bottom: 24px">
    <form class="form-page" id="applyForm">
      <div class="request-switch" id="requestSwitch">
        <button type="button" class="request-switch-btn active" data-type="loan">物品申請</button>
        <button type="button" class="request-switch-btn" data-type="purchase">物品購入申請</button>
      </div>

      <label>団体名<span class="req">*</span></label>
      <input name="organization" required placeholder="例) 3年A組" />

      <label>利用者名<span class="req">*</span></label>
      <input name="user_name" required placeholder="例) 山田 太郎" />

      <label>メールアドレス<span class="req">*</span></label>
      <input name="email" type="email" required placeholder="例) example@school.jp" />

      <section id="loanFields">
        <label>物品<span class="req">*</span></label>
        <button type="button" class="item-picker-btn" id="itemPickerBtn">
          <span class="ph">物品を選択してください</span>
          <span class="arrow">▼</span>
        </button>
        <input type="hidden" name="item_id" id="itemIdInput" />

        <label>個数<span class="req">*</span></label>
        <input name="quantity" type="number" min="1" inputmode="numeric" placeholder="例) 10" />
        <div class="err" id="qtyErr" hidden></div>

        <label>用途<span class="req">*</span></label>
        <textarea name="purpose" rows="3" placeholder="例) 文化祭の準備で使用します。"></textarea>
      </section>

      <section id="purchaseFields" hidden>
        <label>購入した物品の写真</label>
        <input type="file" id="purchaseImageFile" accept="image/*" hidden />
        <label for="purchaseImageFile" class="image-drop" id="purchaseImageDrop">
          <span class="placeholder">
            <span class="ic">📷</span>
            <span>タップして画像を選択（任意）</span>
          </span>
          <img id="purchaseImagePreview" alt="" hidden />
          <button type="button" id="purchaseImageClear" class="img-clear" hidden>×</button>
        </label>

        <label>物品名<span class="req">*</span></label>
        <input name="purchase_name" placeholder="例) 延長コード" />

        <label>種別<span class="req">*</span></label>
        <select name="purchase_item_type">
          <option value="equipment">物品</option>
          <option value="consumable">消耗品</option>
        </select>

        <label>総数<span class="req">*</span></label>
        <input name="purchase_quantity" type="number" min="1" inputmode="numeric" placeholder="例) 20" />

        <label>保管場所</label>
        <select name="purchase_storage_location">
          <option value="">選択してください</option>
        </select>
        <div class="select-add-row">
          <input name="purchaseStorageLocationOption" placeholder="新しい保管場所を追加" />
          <button type="button" class="btn-inline-add" id="addPurchaseStorageLocationBtn">追加</button>
        </div>

        <label>備考</label>
        <textarea name="purchase_note" rows="3" placeholder="例) 文化祭準備用に購入"></textarea>
      </section>

      <button class="btn-primary green" type="submit" id="submitBtn">この内容で申請する</button>
    </form>

    <div class="apply-success" id="done" hidden>
      <div class="check">✓</div>
      <h2>申請を受け付けました</h2>
      <p>申請内容は管理者が確認後、<br>順次対応いたします。</p>
      <button class="btn-primary green" id="again" style="margin-top:0">続けて申請する</button>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div class="picker-modal" id="pickerModal" hidden style="display:none">
    <div class="picker-header">
      <h2>物品を選択</h2>
      <button type="button" class="picker-close" id="pickerClose">×</button>
    </div>
    <div class="picker-search">
      <input id="pickerSearch" placeholder="物品名で検索" />
    </div>
    <div class="picker-cats" id="pickerCats"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/config.local.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/apply.js"></script>
</body>
</html>
