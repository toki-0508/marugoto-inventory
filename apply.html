<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#16a34a" />
  <title>物品申請フォーム</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>物品申請フォーム</h1>
  </header>

  <main id="view" style="padding-bottom: 24px">
    <form class="form-page" id="applyForm">
      <label>団体名<span class="req">*</span></label>
      <input name="organization" required placeholder="例) 3年A組" />

      <label>利用者名<span class="req">*</span></label>
      <input name="user_name" required placeholder="例) 山田 太郎" />

      <label>物品<span class="req">*</span></label>
      <button type="button" class="item-picker-btn" id="itemPickerBtn">
        <span class="ph">物品を選択してください</span>
        <span class="arrow">▼</span>
      </button>
      <input type="hidden" name="item_id" id="itemIdInput" />

      <label>個数<span class="req">*</span></label>
      <input name="quantity" type="number" min="1" required inputmode="numeric" placeholder="例) 10" />
      <div class="err" id="qtyErr" hidden></div>

      <label>用途<span class="req">*</span></label>
      <textarea name="purpose" rows="3" required placeholder="例) 文化祭の準備で使用します。"></textarea>

      <button class="btn-primary green" type="submit">この内容で申請する</button>
    </form>

    <div class="apply-success" id="done" hidden>
      <div class="check">✓</div>
      <h2>申請を受け付けました</h2>
      <p>申請内容は管理者が確認後、<br>順次対応いたします。</p>
      <button class="btn-primary green" id="again" style="margin-top:0">続けて申請する</button>
    </div>
  </main>

  <div id="toast" class="toast" hidden></div>

  <div class="picker-modal" id="pickerModal" hidden>
    <div class="picker-header">
      <h2>物品を選択</h2>
      <button type="button" class="picker-close" id="pickerClose">×</button>
    </div>
    <div class="picker-search">
      <input id="pickerSearch" placeholder="物品名で検索" />
    </div>
    <div class="picker-cats" id="pickerCats"></div>
    <div class="picker-list" id="pickerList"></div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/config.local.js" onerror=""></script>
  <script src="./js/api.js"></script>
  <script src="./js/apply.js"></script>
</body>
</html>
